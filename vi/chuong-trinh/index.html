<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Chương trình du lịch Cao Bằng — Sắp ra mắt · Sen's Homestay</title>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="description" content="Combo du lịch Cao Bằng trọn gói của Sen's Homestay đang hoàn thiện. Nhắn Zalo để Sen báo trước khi mở bán."/>
  <link rel="icon" type="image/png" href="/images/favicon.png"/>
  <link rel="apple-touch-icon" href="/images/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:#FBF7EF; --surface:#FFFFFF;
      --ink:#2A2118; --ink-soft:#6B5D4C;
      --terra:#B65A36; --terra-deep:#9A4A2E;
      --r-pill: 999px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Hanken Grotesk', system-ui, sans-serif;
      background: var(--paper); color: var(--ink); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 32px 24px;
    }
    a { text-decoration: none; color: inherit; }
    .logo { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 26px; }
    .flag {
      display: inline-block; font-size: 0.7rem; font-weight: 800;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 7px 16px; border-radius: var(--r-pill);
      background: rgba(200,132,31,0.15); color: #8A5D0F; margin-bottom: 20px;
    }
    h1 {
      font-family: 'Bricolage Grotesque', 'Hanken Grotesk', sans-serif;
      font-size: clamp(1.9rem, 5vw, 2.9rem); font-weight: 800;
      line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 16px;
      text-wrap: balance;
    }
    .sub { color: var(--ink-soft); max-width: 30rem; margin-bottom: 34px; font-size: 1.02rem; }
    .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 26px; border-radius: var(--r-pill);
      font-weight: 700; font-size: 0.9rem; transition: transform 0.2s, background 0.2s;
    }
    .btn-primary { background: var(--terra-deep); color: #fff; }
    .btn-primary:hover { background: var(--terra); transform: translateY(-2px); }
    .btn-ghost { color: var(--ink-soft); box-shadow: inset 0 0 0 1.5px rgba(42,33,24,0.18); }
    .btn-ghost:hover { color: var(--terra-deep); transform: translateY(-2px); }
    .btn img { width: 17px; height: 17px; }
    .foot { margin-top: 46px; font-size: 0.82rem; color: var(--ink-soft); opacity: 0.75; }
  </style>
</head>
<body>
  <img class="logo" src="/images/favicon.png" alt="Sen's Homestay" onerror="this.style.display='none'">

  <span class="flag">Sắp ra mắt</span>
  <h1>Combo Cao Bằng trọn gói<br>đang hoàn thiện</h1>
  <p class="sub">
    Sen đang chốt lại lịch trình, giá và chỗ nghỉ cho combo 2N1Đ &amp; 3N2Đ.
    Nhắn Zalo để Sen báo bạn ngay khi mở bán nhé.
  </p>

  <div class="btns">
    <a class="btn btn-primary" href="https://zalo.me/0822946888" target="_blank" rel="noopener">
      <img src="/images/icon-zalo.png" alt="" aria-hidden="true" onerror="this.style.display='none'">
      Nhắn Zalo cho Sen
    </a>
    <a class="btn btn-ghost" href="/vi/index.html">Về trang chủ</a>
  </div>

  <p class="foot">© 2025 Sen's Homestay · Cao Bằng, Việt Nam</p>
</body>
</html>
